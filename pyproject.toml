[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yaad-memory"
version = "0.1.0"
description = "Evidence-backed local personal memory engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "httpx>=0.27", "typer>=0.12", "pymupdf>=1.24", "pillow>=10.4", "python-docx>=1.1", "python-multipart>=0.0.9", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "reportlab>=4.2"]

[project.scripts]
yaad = "yaad.cli:app"

[tool.setuptools.packages.find]
include = ["yaad*"]
